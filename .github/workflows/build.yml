name: build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload DLL
        uses: actions/upload-artifact@v5
        with:
          name: WTSAPI32
          path: build/Release/WTSAPI32.dll

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download DLL
        uses: actions/download-artifact@v5
        with:
          name: WTSAPI32

      - name: Locate DLL
        run: find . -name WTSAPI32.dll -exec cp {} ./WTSAPI32.dll \;

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: WTSAPI32.dll
          generate_release_notes: true
          prerelease: true